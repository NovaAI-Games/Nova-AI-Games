<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Nova AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* HEADER PRINCIPALE */
    .main-header {
      background: #0f0f0f;
      border-bottom: 1px solid #222;
      color: white;
      padding: 0px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      width: 100%;
      height: 65px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .main-header .logo {
      font-size: 1.3rem;
      font-weight: 600;
      color: #0c82c2;
      letter-spacing: 1px;
    }

    .main-header nav {
      display: flex;
      gap: 29.5px;
      font-size: 17px;
      margin-left: auto;
    }

    .main-header nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .main-header nav a:hover {
      color: #0c82c2;
    }

    /* SUB-HEADER */
    .sub-header {
      background: #0078ff;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: fixed;
      top: 60px;
      width: 100%;
      box-sizing: border-box;
      z-index: 19;
    }

    .sub-header span{
      font-size: 22px;
      cursor: pointer;
    }

    .sub-header span[id="chat-title"] {
      letter-spacing: 1px;
      font-size: 1.3rem;
      font-weight: 600;
      margin-right: 1200px;
      margin-left: 10px;
    }

    /* CHAT */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 140px 20px 20px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      margin-bottom: 15px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .assistant-row {
      flex-direction: row;
    }

    .assistant-bubble {
      background: white;
      border: 1px solid #ddd;
      margin-left: 10px;
    }

    .user-row {
      flex-direction: row-reverse;
    }

    .user-bubble {
      background: #0078ff;
      color: white;
      margin-right: 10px;
    }

    /* INPUT */
    #input-area {
      display: flex;
      padding: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #send-btn {
      margin-left: 10px;
      padding: 10px 18px;
      font-size: 16px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #send-btn:hover {
      background: #005fcc;
    }

    /* ANIMAZIONE TYPING */
    .typing {
      display: flex;
      align-items: center;
      margin-left: 10px;
      font-size: 14px;
      color: #555;
    }

    .typing span {
      height: 8px;
      width: 8px;
      margin: 0 2px;
      background: #999;
      border-radius: 50%;
      display: inline-block;
      animation: blink 1.4s infinite both;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }

    /* PANNELLO STORICO */
    #history-panel {
      position: fixed;
      top: 0;
      right: -390px; /* leggermente più fuori */
      width: 350px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 8px rgba(0,0,0,0.2);
      padding: 20px;
      transition: right 0.35s ease;
      z-index: 9999;
      overflow-y: auto;
    }

    #history-panel.open {
      right: 0;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    .history-item:hover {
      background: #f0f0f0;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-actions {
      display: flex;
      gap: 8px;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .history-actions span {
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      user-select: none;
    }

    .history-actions span:hover {
      color: #0078ff;
    }

  </style>
</head>

<body>

  <!-- HEADER PRINCIPALE -->
  <header class="main-header">
    <div class="logo">Nova AI & Games</div>

    <nav>
      <a href="../MySite.html">Home</a>
      <a href="../games.html">Giochi</a>
      <a href="assistant.html">Nova AI</a>
      <a href="../scuola.html">Scuola</a>
    </nav>
  </header>

  <!-- SUB-HEADER -->
  <div class="sub-header">
    <span id="chat-title">Nova AI</span>
    <span id="open-history">💾</span>
    <span id="new-chat">🔄</span>
  </div>

  <!-- PANNELLO STORICO -->
  <div id="history-panel"></div>

  <!-- CHAT -->
  <div id="chat-container"></div>

  <!-- INPUT -->
  <div id="input-area">
    <input id="user-input" type="text" placeholder="Scrivi un messaggio...">
    <button id="send-btn">Invia</button>
  </div>

<script>
const API_KEY = "VF.DM.67d2fa2201f3330705637a97.YVYfOGhHRYi9urSj";
const VERSION_ID = "production";
const USER_ID = "assistant-user-1";

const chat = document.getElementById("chat-container");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const historyPanel = document.getElementById("history-panel");

const STORAGE_SESSIONS = "nova_chat_sessions";
const STORAGE_CURRENT = "nova_chat_current";

let sessions = JSON.parse(localStorage.getItem(STORAGE_SESSIONS)) || [];
let currentSessionIndex = parseInt(localStorage.getItem(STORAGE_CURRENT), 10);
if (isNaN(currentSessionIndex) || currentSessionIndex < 0 || currentSessionIndex >= sessions.length) {
  currentSessionIndex = -1;
}

function saveSessions() {
  localStorage.setItem(STORAGE_SESSIONS, JSON.stringify(sessions));
  localStorage.setItem(STORAGE_CURRENT, currentSessionIndex);
}

function getCurrentSession() {
  if (currentSessionIndex === -1) return null;
  return sessions[currentSessionIndex];
}

function createNewSession(title) {
  const nextTitle = title || `Conversazione ${sessions.length + 1}`;
  sessions.push({ title: nextTitle, messages: [] });
  currentSessionIndex = sessions.length - 1;
  saveSessions();
  renderCurrentSession();
}

function renderCurrentSession() {
  const session = getCurrentSession();
  const titleEl = document.getElementById("chat-title");

  if (!session) {
    titleEl.textContent = "Nova AI";
    chat.innerHTML = "";
    return;
  }

  titleEl.textContent = session.title;
  chat.innerHTML = "";
  session.messages.forEach(msg => addMessage(msg.text, msg.sender, false));
  scrollToBottom();
}

function saveCurrentSession() {
  saveSessions();
}

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(text, sender, save = true) {
  const row = document.createElement("div");
  row.className = sender === "assistant" ? "message-row assistant-row" : "message-row user-row";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.innerHTML = `<img src="${sender === 'assistant' ? 'nova.jpg' : 'utente.jpg'}">`;

  const bubble = document.createElement("div");
  bubble.className = sender === "assistant" ? "bubble assistant-bubble" : "bubble user-bubble";
  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);

  if (save) {
    let session = getCurrentSession();
    if (!session) {
      createNewSession();
      session = getCurrentSession();
    }

    session.messages.push({ text, sender });
    saveCurrentSession();
  }

  scrollToBottom();
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "message-row assistant-row";
  row.id = "typing-row";

  row.innerHTML = `
    <div class="avatar"><img src="nova.jpg"></div>
    <div class="typing">
      <span></span><span></span><span></span>
    </div>
  `;

  chat.appendChild(row);
  scrollToBottom();
}

function hideTyping() {
  const typingRow = document.getElementById("typing-row");
  if (typingRow) typingRow.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  showTyping();

  try {
    const response = await fetch(
      `https://general-runtime.voiceflow.com/state/${VERSION_ID}/user/${USER_ID}/interact`,
      {
        method: "POST",
        headers: {
          "Authorization": API_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          request: {
            type: "text",
            payload: text
          }
        })
      }
    );

    const data = await response.json();
    hideTyping();

    let output = "";

    for (const trace of data) {
      if (trace.type === "text" && trace.payload?.message) {
        output += trace.payload.message + "\n";
      }
      if (trace.type === "speak" && trace.payload?.message) {
        output += trace.payload.message + "\n";
      }
    }

    addMessage(output.trim(), "assistant");

  } catch (err) {
    hideTyping();
    addMessage("Errore nel contattare l'assistente.", "assistant");
  }
}

/* STORICO */
function renderHistoryList() {
  historyPanel.innerHTML = "<h2>Trascrizioni salvate</h2>";
  historyPanel.innerHTML += "<p>Clicca su una trascrizione per caricarla nella chat.</p>";
  historyPanel.innerHTML += "<hr>";

  sessions.forEach((session, i) => {
    const item = document.createElement("div");
    item.className = "history-item";

    const lastMessage = session.messages.length ? session.messages[session.messages.length - 1].text : "(vuota)";

    const info = document.createElement("div");
    info.className = "history-info";
    info.innerHTML = `<strong>${session.title}</strong><br><small>${lastMessage.slice(0, 40)}...</small>`;

    const actions = document.createElement("div");
    actions.className = "history-actions";

    const renameBtn = document.createElement("span");
    renameBtn.title = "Rinomina";
    renameBtn.textContent = "✏️";
    renameBtn.onclick = (e) => {
      e.stopPropagation();
      const newTitle = prompt("Nome della conversazione:", session.title);
      if (newTitle && newTitle.trim()) {
        session.title = newTitle.trim();
        saveSessions();
        renderCurrentSession();
        renderHistoryList();
      }
    };

    const deleteBtn = document.createElement("span");
    deleteBtn.title = "Elimina";
    deleteBtn.textContent = "🗑️";
    deleteBtn.onclick = (e) => {
      e.stopPropagation();
      if (!confirm("Eliminare definitivamente questa conversazione?")) return;

      sessions.splice(i, 1);

      if (currentSessionIndex === i) {
        currentSessionIndex = sessions.length ? Math.min(i, sessions.length - 1) : -1;
      } else if (currentSessionIndex > i) {
        currentSessionIndex--;
      }

      if (sessions.length === 0) {
        createNewSession();
      } else {
        saveSessions();
        renderCurrentSession();
      }

      renderHistoryList();
    };

    actions.append(renameBtn, deleteBtn);

    item.append(info, actions);

    item.onclick = () => {
      currentSessionIndex = i;
      saveSessions();
      renderCurrentSession();
      historyPanel.classList.remove("open");
    };

    historyPanel.appendChild(item);
  });
}

document.getElementById("open-history").onclick = () => {
  historyPanel.classList.toggle("open");
  if (historyPanel.classList.contains("open")) {
    renderHistoryList();
  }
};

document.addEventListener("click", (e) => {
  if (
    historyPanel.classList.contains("open") &&
    !historyPanel.contains(e.target) &&
    e.target.id !== "open-history"
  ) {
    historyPanel.classList.remove("open");
  }
});

/* NUOVA CONVERSAZIONE */
document.getElementById("new-chat").onclick = () => {
  if (confirm("Vuoi iniziare una nuova conversazione?")) {
    createNewSession();
  }
};

/* RINOMINA CONVERSAZIONE */
document.getElementById("chat-title").onclick = () => {
  const session = getCurrentSession();
  if (!session) return;

  const newTitle = prompt("Nome della conversazione:", session.title);
  if (newTitle && newTitle.trim()) {
    session.title = newTitle.trim();
    saveSessions();
    renderCurrentSession();
  }
};

sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

/* CARICA CHAT SALVATA ALL'AVVIO */
if (sessions.length === 0) {
  createNewSession();
} else {
  renderCurrentSession();
}
</script>

</body>
</html>
