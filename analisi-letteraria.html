<body>
<div class="app">

  <header class="main-header">

    <nav>

  <div class="container">

    <input type="hidden" id="apiKey" value="" />

        </div>
      </div>
    </details>

    <div class="input-group">
      <div class="section-label">Classe scolastica</div>
      <select id="classe">
        <option value="">Seleziona la classe...</option>
        <optgroup label="Scuola Media">
          <option>1&ordf; Media</option>

        </optgroup>
        <optgroup label="Scuola Superiore">
          <option>1&ordf; Superiore</option>
          <option>2&ordf; Superiore</option>
          <option>3&ordf; Superiore</option>
          <option>4&ordf; Superiore</option>
          <option>5&ordf; Superiore (Maturit&agrave;)</option>
        </optgroup>
        <optgroup label="Universit&agrave;">
          <option value="Universita primo anno">Universit&agrave; &mdash; primo anno</option>
          <option value="Universita avanzato">Universit&agrave; &mdash; avanzato</option>

    <div class="row-2">
      <div class="col-sm">

        <input type="number" id="parole" value="300" min="50" max="2000" placeholder="es. 300" />
      </div>
      <div class="col-lg">
        <div class="section-label">Traccia del tema (opzionale)</div>
        <textarea id="traccia" rows="2" placeholder="Es. 'Analizza il tema della memoria...' oppure lascia vuoto"></textarea>
      </div>
    </div>

    <div class="input-group">
      <div class="section-label">Testo da analizzare</div>
      <textarea id="testo" rows="10" placeholder="Incolla qui il testo letterario, l'articolo o il brano da analizzare..."></textarea>
    </div>

    <div class="input-group">
      <div class="section-label">Domande</div>

      <button class="add-btn" onclick="addDomanda()">+ Aggiungi domanda</button>

    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">&#10022; Analizza e scrivi il tema</button>

    <div class="error-box" id="errorBox"></div>
    <div class="loading" id="loading">Il professore sta elaborando la risposta perfetta...</div>

    <div id="resultBox" class="result-box hidden">
      <div class="result-content" id="resultContent"></div>
      <button class="copy-result-btn" id="copyBtn" onclick="copyResult()">&oplus; Copia tutto</button>
    </div>

  </div>
</div>

<script>
const SYSTEM_PROMPT_DEFAULT = `Sei un professore di italiano esperto con 20 anni di esperienza nelle scuole superiori italiane. Il tuo compito è analizzare testi letterari o articoli e rispondere alle domande in modo eccellente, poi scrivere un tema argomentativo da 10/10.
## FASE 1 - ANALISI DEL TESTO
Quando ricevi un testo, esegui:
- Comprensione globale: identifica tema centrale, struttura, messaggio dell'autore
- Analisi stilistica: figure retoriche, registro linguistico, tono, scelte lessicali
- Contestualizzazione: periodo storico, corrente letteraria, biografia dell'autore se rilevante
- Nuclei tematici: individua i concetti chiave da usare poi nel tema
## FASE 2 - RISPOSTA ALLE DOMANDE
Per ogni domanda fornita:
- Rispondi in modo completo, preciso e articolato
- Cita solo quando ritieni necessario parole o frasi del testo a supporto della risposta (tra virgolette)
- Usa un linguaggio formale e curato
- Struttura la risposta con introduzione, sviluppo e conclusione breve
- Dimostra capacita critica e interpretativa, non solo descrittiva
- Connetti la risposta ai temi piu ampi del testo
## FASE 3 - TEMA ARGOMENTATIVO (lunghezza indicata dall'utente)
Scrivi un tema argomentativo strettamente connesso al testo (e alla traccia fornita, se presente) con questa struttura:
1. Introduzione (30-40 parole): aggancia il lettore con una citazione, domanda retorica o affermazione forte; presenta la tesi chiaramente
2. Argomentazione 1 (60-80 parole): tesi principale con argomentazione solida e riferimento al testo
3. Argomentazione 2 (60-80 parole): secondo punto di vista, eventuale contro-argomentazione confutata
4. Argomentazione 3 (60-80 parole): terzo punto di vista, eventuale contro-argomentazione confutata
5. Conclusione (30-40 parole): sintesi potente, allargamento al contesto contemporaneo, chiusura ad effetto
CRITERI DI ECCELLENZA:
- Usa connettivi logici sofisticati: tuttavia, d'altronde, e indubbio che, a tal proposito
- Inserisci almeno 2 citazioni dal testo originale
- Varia la struttura delle frasi (brevi e incisive alternate a complesse)
- Dimostra pensiero critico autonomo, non solo riassunto
- Il registro deve essere formale-elevato ma non artificioso
REGOLA SUL CONTEGGIO PAROLE:
- Rispetta il piu possibile il numero di parole indicato dall'utente
- Il sistema verifichera automaticamente il conteggio e ti chiedera correzioni se necessario
FORMATO OUTPUT:
---
### ANALISI DEL TESTO
[analisi]
### RISPOSTE ALLE DOMANDE
Domanda 1: [testo domanda]
[risposta completa]
Domanda 2: [testo domanda]
[risposta completa]
(continua per tutte le domande)
### TEMA ARGOMENTATIVO
Titolo: [titolo originale e evocativo]
[tema del numero di parole richiesto]
(Conteggio parole: [numero esatto])
---`;

// Init
document.getElementById('systemPrompt').value = SYSTEM_PROMPT_DEFAULT;
const savedKey = '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';
document.getElementById('apiKey').value = savedKey;

let domandaCount = 0;

function addDomanda() {
  domandaCount++;
  var grid = document.getElementById('domande');
  var idx = grid.children.length + 1;
  var row = document.createElement('div');
  row.className = 'question-row';
  row.id = 'qrow-' + domandaCount;
  var id = domandaCount;
  row.innerHTML =
    '<span class="question-num">' + idx + '.</span>' +
    '<textarea rows="2" placeholder="Domanda ' + idx + '..." class="domanda-input"></textarea>' +
    '<button class="remove-btn" onclick="removeDomanda(\'qrow-' + id + '\')">&#215;</button>';
  grid.appendChild(row);
}

function removeDomanda(rowId) {
  var el = document.getElementById(rowId);
  if (el) el.remove();
  renumberDomande();
}

function renumberDomande() {
  var rows = document.querySelectorAll('.question-row');
  rows.forEach(function(row, i) {
    row.querySelector('.question-num').textContent = (i + 1) + '.';
    row.querySelector('textarea').placeholder = 'Domanda ' + (i + 1) + '...';
  });
}

addDomanda();
addDomanda();

function copyPrompt() {
  navigator.clipboard.writeText(document.getElementById('systemPrompt').value);
}

function resetPrompt() {
  document.getElementById('systemPrompt').value = SYSTEM_PROMPT_DEFAULT;
}

function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.*)/gm, '<h3>$1</h3>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function countWords(text) {
  return text.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
}

function extractTema(text) {
  var lines = text.split('\n');
  var inTema = false;
  var temaLines = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/Titolo:/i.test(line)) { inTema = true; continue; }
    if (inTema) {
      if (/\(Conteggio/i.test(line)) break;
      var clean = line
        .replace(/^#{1,4}\s*/, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/^[-*>]\s*/, '')
        .replace(/^---+$/, '')
        .trim();
      if (clean.length > 0) temaLines.push(clean);
    }
  }
  return temaLines.length > 0 ? temaLines.join(' ') : null;
}

async function callAPI(messages) {
  var apiKey = document.getElementById('apiKey').value.trim();
  var systemPrompt = document.getElementById('systemPrompt').value;
  var allMessages = [{ role: 'system', content: systemPrompt }].concat(messages);
  var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      max_tokens: 8000,
      messages: allMessages
    })
  });
  var data = await res.json();
  if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
}

function setLoading(on) {
  document.getElementById('loading').className = on ? 'loading visible' : 'loading';
  document.getElementById('submitBtn').disabled = on;
}

function showError(msg) {
  var el = document.getElementById('errorBox');
  el.textContent = msg;
  el.className = 'error-box visible';
}

function hideError() {
  document.getElementById('errorBox').className = 'error-box';
}

function setResult(html) {
  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('resultBox').classList.remove('hidden');
}

var lastRawText = '';

async function handleSubmit() {
  var testo = document.getElementById('testo').value.trim();
  var apiKey = document.getElementById('apiKey').value.trim();
  if (!testo) return;
  if (!apiKey) { showError('Inserisci la tua API Key Groq.'); return; }

  hideError();
  setLoading(true);
  document.getElementById('resultBox').classList.add('hidden');

  var target = parseInt(document.getElementById('parole').value) || 300;
  var classe = document.getElementById('classe').value;
  var traccia = document.getElementById('traccia').value.trim();
  var domande = Array.from(document.querySelectorAll('.domanda-input'))
    .map(function(t) { return t.value.trim(); }).filter(Boolean);

  var classeInfo = classe ? 'CLASSE: ' + classe + '\nAdatta il livello linguistico alla classe indicata.\n\n' : '';
  var paroleInfo = 'LUNGHEZZA TEMA: esattamente ' + target + ' parole.\n';
  var tracciaInfo = traccia ? 'TRACCIA: ' + traccia + '\n\n' : '';
  var domandeInfo = domande.length > 0
    ? 'DOMANDE:\n' + domande.map(function(d, i) { return (i+1) + '. ' + d; }).join('\n')
    : 'Nessuna domanda specifica. Analizza il testo e scrivi il tema argomentativo.';

  var userMsg = classeInfo + paroleInfo + tracciaInfo + 'TESTO DA ANALIZZARE:\n\n' + testo + '\n\n' + domandeInfo;

  try {
    var text = await callAPI([{ role: 'user', content: userMsg }]);

    var temaMarker = '### TEMA ARGOMENTATIVO';
    var temaIdx = text.indexOf(temaMarker);
    var base = temaIdx > -1 ? text.substring(0, temaIdx).trimEnd() : text;
    var currentTema = temaIdx > -1 ? text.substring(temaIdx) : text;

    var attempts = 0;
    var MAX = 10;

    while (attempts < MAX) {
      var temaSection = extractTema(base + '\n\n' + currentTema);
      var actual = countWords(temaSection || '');
      var diff = actual - target;

      if (Math.abs(diff) <= 5) {
        currentTema = currentTema.replace(/\n*\(Conteggio[^)]*\)/gi, '').trimEnd();
        currentTema += '\n\n(Conteggio parole: ' + actual + ')';
        break;
      }

      attempts++;
      if (attempts >= MAX) {
        currentTema = currentTema.replace(/\n*\(Conteggio[^)]*\)/gi, '').trimEnd();
        currentTema += '\n\n(Conteggio parole: ' + actual + ' — obiettivo: ' + target + ')';
        break;
      }

      setResult(renderMarkdown(base + '\n\n' + currentTema + '\n\n---\nCorrezione in corso: ' + actual + ' parole rilevate, tentativo ' + attempts + '/' + MAX + '...'));
      await new Promise(function(r) { setTimeout(r, 1000); });

      var action = diff > 0
        ? 'CORREZIONE: il tema ha ' + actual + ' parole, ne servono ' + target + ' (+-5). Elimina esattamente ' + diff + ' parole. Riscrivi SOLO il blocco tema:\n\n### TEMA ARGOMENTATIVO\nTitolo: [titolo]\n\n[testo]'
        : 'CORREZIONE: il tema ha ' + actual + ' parole, ne servono ' + target + ' (+-5). Aggiungi esattamente ' + Math.abs(diff) + ' parole. Riscrivi SOLO il blocco tema:\n\n### TEMA ARGOMENTATIVO\nTitolo: [titolo]\n\n[testo]';

      var corrected = await callAPI([{ role: 'user', content: action + '\n\nTEMA DA CORREGGERE:\n\n' + currentTema }]);
      var correctedIdx = corrected.indexOf('### TEMA ARGOMENTATIVO');
      currentTema = correctedIdx > -1 ? corrected.substring(correctedIdx) : corrected;
    }

    lastRawText = base + '\n\n' + currentTema;
    setResult(renderMarkdown(lastRawText));

  } catch(e) {
    showError('Errore: ' + e.message);
  } finally {
    setLoading(false);
  }
}

function copyResult() {
  navigator.clipboard.writeText(lastRawText);
  var btn = document.getElementById('copyBtn');
  btn.textContent = 'Copiato!';
  setTimeout(function() { btn.innerHTML = '&oplus; Copia tutto'; }, 2000);
}
</script>
